<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmPoster Patreon Login</title>
</head>
<body>
    <p>Signing you back into EmPoster…</p>
    <script>
        // Patreon requires an https:// redirect URI, so this page receives the
        // OAuth code and bounces it into the app through the pocketposter://
        // URL scheme.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');

            if (code) {
                window.location.replace('pocketposter://patreon?code=' + encodeURIComponent(code));
            } else if (params.get('error')) {
                window.location.replace('pocketposter://patreon?error=' + encodeURIComponent(params.get('error')));
            } else {
                document.body.innerHTML = '<p>Missing OAuth code. Please close this page and try logging in again.</p>';
            }
        })();
    </script>
</body>
</html>
